<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#001a06"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="6" y="42" width="748" height="330" rx="10"/>
    </clipPath>
  </defs>

  <!-- outer frame -->
  <rect x="3" y="3" width="754" height="374" rx="16" fill="url(#termBg)" stroke="#00FF41" stroke-width="2"/>

  <!-- title bar -->
  <rect x="3" y="3" width="754" height="36" rx="16" fill="#0A0A0A"/>
  <rect x="3" y="23" width="754" height="16" fill="#0A0A0A"/>
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="21" r="6" fill="#27C93F"/>
  <text x="380" y="26" font-family="Fira Code, monospace" font-size="13" fill="#A1A1A1" text-anchor="middle">
    mehandi@root: ~/systems/core
  </text>

  <!-- matrix rain columns, clipped inside terminal body -->
  <g clip-path="url(#termClip)" font-family="Fira Code, monospace" font-size="14" fill="#00FF41" opacity="0.35">
    <g>
      <text x="40" y="0">01</text><text x="40" y="20">10</text><text x="40" y="40">11</text>
      <text x="40" y="60">00</text><text x="40" y="80">01</text><text x="40" y="100">10</text>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="0,380" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="110" y="0">1F</text><text x="110" y="20">A3</text><text x="110" y="40">0C</text>
      <text x="110" y="60">7E</text><text x="110" y="80">B2</text><text x="110" y="100">9D</text>
      <animateTransform attributeName="transform" type="translate" from="0,-150" to="0,380" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="670" y="0">10</text><text x="670" y="20">01</text><text x="670" y="40">11</text>
      <text x="670" y="60">00</text><text x="670" y="80">10</text><text x="670" y="100">01</text>
      <animateTransform attributeName="transform" type="translate" from="0,-80" to="0,380" dur="5.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="700" y="0">4B</text><text x="700" y="20">E1</text><text x="700" y="40">2A</text>
      <text x="700" y="60">9F</text><text x="700" y="80">C6</text><text x="700" y="100">03</text>
      <animateTransform attributeName="transform" type="translate" from="0,-250" to="0,380" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- scanning glow line -->
  <g clip-path="url(#termClip)">
    <rect x="6" y="0" width="748" height="60" fill="url(#scanGlow)">
      <animateTransform attributeName="transform" type="translate" from="0,-60" to="0,380" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- terminal text -->
  <g font-family="Fira Code, monospace" font-size="17" fill="#00FF41" filter="url(#softGlow)">
    <text x="35" y="90">&gt; booting systems_architect.exe</text>
    <text x="35" y="122">&gt; loading fintech_backend_modules... <tspan fill="#FFFFFF">OK</tspan></text>
    <text x="35" y="154">&gt; compiling dsa_core... <tspan fill="#FFFFFF">OK</tspan></text>
    <text x="35" y="186">&gt; connecting data_science_pipeline...</text>
    <text x="35" y="218">&gt; status: <tspan fill="#FFFFFF">ONLINE</tspan></text>
    <text x="35" y="260" font-size="15" fill="#A1A1A1">&gt; role: Systems Architect | Fintech Backend</text>
    <text x="35" y="286" font-size="15" fill="#A1A1A1">&gt; edu: B.Tech CS @ COEP Pune</text>
  </g>

  <!-- blinking cursor -->
  <rect x="330" y="204" width="12" height="18" fill="#00FF41">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- corner circuit accents -->
  <g stroke="#00FF41" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 6 340 L 6 372 L 38 372"/>
    <path d="M 754 340 L 754 372 L 722 372"/>
    <circle cx="6" cy="340" r="3" fill="#00FF41"/>
    <circle cx="754" cy="340" r="3" fill="#00FF41"/>
  </g>
</svg>
